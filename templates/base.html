<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11142b">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <nav class="site-nav">
    <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">✦</span> CampusConnect</a>
    <div class="nav-links">
    {% if user.is_authenticated %}
    <span class="nav-greeting">Hi, {{ user.username }}!</span>
    {% if user.is_superuser or user.role == "ADMIN" %}
        <a class="nav-link" href="{% url 'admin_panel' %}">Admin Panel</a>
    {% endif %}
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="nav-button" type="submit">Log out</button>
    </form>
    {% else %}
        <a class="nav-link" href="{% url 'login' %}">Log in</a>
        <a class="button button-small" href="{% url 'signup' %}">Sign up</a>
    {% endif %}
    </div>
    </nav>
    <main class="page-shell">{% block content %}{% endblock %}</main>
</body>
</html>
