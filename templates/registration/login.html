{% extends "base.html" %}

{% block title %}Log in | CampusConnect{% endblock %}

{% block content %}
<section class="auth-card">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Log in</h1>
  <p class="muted">Pick up where your campus community left off.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Log in <span aria-hidden="true">→</span></button>
  </form>
  <p class="auth-footer">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</section>
{% endblock %}
