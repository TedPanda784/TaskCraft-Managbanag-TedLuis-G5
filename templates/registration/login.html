{% extends "base.html" %}

{% block title %}Log in | TaskCraft{% endblock %}

{% block content %}
<section class="auth-card">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Log in</h1>
  <p class="muted">Get back to your projects, sprints, and bug reports.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Log in <span aria-hidden="true">→</span></button>
  </form>
  <p class="auth-footer">New to TaskCraft? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
