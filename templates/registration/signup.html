{% extends "base.html" %}

{% block title %}Sign up | TaskCraft{% endblock %}

{% block content %}
<section class="auth-card">
  <p class="eyebrow">START BUILDING</p>
  <h1>Create your account</h1>
  <p class="muted">Set up a focused workspace for your game projects.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Create account <span aria-hidden="true">→</span></button>
  </form>
  <p class="auth-footer">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
