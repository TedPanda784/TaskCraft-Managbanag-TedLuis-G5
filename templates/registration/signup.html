{% extends "base.html" %}

{% block title %}Sign up | CampusConnect{% endblock %}

{% block content %}
<section class="auth-card">
  <p class="eyebrow">JOIN YOUR CAMPUS</p>
  <h1>Create your account</h1>
  <p class="muted">Find your people and get connected.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Create account <span aria-hidden="true">→</span></button>
  </form>
  <p class="auth-footer">Already a member? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
